services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ranchbot-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    networks:
      - ranchbot-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ranchbot-backend
    restart: unless-stopped
    environment:
      - RANCHBOT_API_URL=${RANCHBOT_API_URL}
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-False}
    volumes:
      - thumbnail-cache:/tmp/thumbnails
      - adjusted-video-cache:/tmp/adjusted_videos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ranchbot-network

  worker-thumbnail:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ranchbot-worker-thumbnail
    restart: unless-stopped
    command: python -u workers/thumbnail_worker.py
    environment:
      - PYTHONUNBUFFERED=1
      - RANCHBOT_API_URL=${RANCHBOT_API_URL}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
    volumes:
      - thumbnail-cache:/tmp/thumbnails
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ranchbot-network

  worker-adjustment:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ranchbot-worker-adjustment
    restart: unless-stopped
    command: python -u workers/adjustment_worker.py
    environment:
      - PYTHONUNBUFFERED=1
      - RANCHBOT_API_URL=${RANCHBOT_API_URL}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
    volumes:
      - adjusted-video-cache:/tmp/adjusted_videos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ranchbot-network

  frontend:
    build:
      context: ./vue-app
      dockerfile: Dockerfile
    container_name: ranchbot-frontend
    restart: unless-stopped
    ports:
      - '8880:80'
    depends_on:
      - backend
    networks:
      - ranchbot-network

networks:
  ranchbot-network:
    driver: bridge

volumes:
  thumbnail-cache:
  adjusted-video-cache:
